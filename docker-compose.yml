services:
  landmark-drowsiness-detector:
    build:
      context: .
      dockerfile: Dockerfile
    image: landmark-drowsiness-detector
    container_name: simplify-drowsiness-detector
    restart: unless-stopped
    labels:
      - "com.mdvr.service=landmark-drowsiness-detector"
      - "com.mdvr.version=1.0"
    volumes:
      - ./logs:/app/logs
      - landmark_db_data:/app/data
      - ./data:/app/data_host
    ports:
      - 8002:8002
    networks:
      - proxy
    environment:
      - LANDMARK_PORT=8002
      - LANDMARK_HOST=0.0.0.0
      - LANDMARK_MAX_WORKERS=1
      - LANDMARK_QUEUE_CHECK_INTERVAL=5
      - LANDMARK_DB_PATH=/app/data/landmark_detection.db
      - LANDMARK_FRAME_SKIP=2
      - LANDMARK_EAR_THRESHOLD=0.25
      - LANDMARK_PERCLOS_THRESHOLD=0.30
      - LANDMARK_FATIGUE_THRESHOLD=0.60
      - LANDMARK_PERCLOS_WINDOW_SECONDS=1.5
      - NVIDIA_VISIBLE_DEVICES=all # Expose all GPUs to the container
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility # Enable compute and utility capabilities
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    init: true
    stop_signal: SIGINT
    stop_grace_period: 30s

volumes:
  landmark_db_data:
    name: landmark_db_data

networks:
  proxy:
    external: true