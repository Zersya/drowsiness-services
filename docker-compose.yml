services:
  landmark-drowsiness-detector:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_TYPE: gpu  # Change to 'cpu' for CPU-only build
    image: landmark-drowsiness-detector-gpu
    container_name: simplify-drowsiness-detector
    restart: unless-stopped
    labels:
      - "com.mdvr.service=landmark-drowsiness-detector"
      - "com.mdvr.version=2.0-gpu"
    volumes:
      - ./logs:/app/logs
      - landmark_db_data:/app/data
      - ./data:/app/data_host
    ports:
      - 8002:8002
    networks:
      - proxy
    environment:
      - LANDMARK_PORT=8002
      - LANDMARK_HOST=0.0.0.0
      - LANDMARK_MAX_WORKERS=1
      - LANDMARK_QUEUE_CHECK_INTERVAL=5
      - LANDMARK_DB_PATH=/app/data/landmark_detection.db
      - LANDMARK_FRAME_SKIP=2
      - LANDMARK_EAR_THRESHOLD=0.25
      - LANDMARK_PERCLOS_THRESHOLD=0.30
      - LANDMARK_FATIGUE_THRESHOLD=0.60
      - LANDMARK_PERCLOS_WINDOW_SECONDS=1.5
      # GPU acceleration settings
      - CUDA_VISIBLE_DEVICES=0
      - DISABLE_GPU=false
      - CUDA_DEVICE_ID=0
    deploy:
      resources:
        reservations:
          cpus: '2'
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    init: true
    stop_signal: SIGINT
    stop_grace_period: 30s

volumes:
  landmark_db_data:
    name: landmark_db_data

networks:
  proxy:
    external: true